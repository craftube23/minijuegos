<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Feria Mágica del Juguete - Minijuegos</title>
    <link rel="icon" type="image/png" href="./assets/logos/Feria-magica-del-jugete-sin-fondo.webp" />
    <link rel="apple-touch-icon" href="./assets/logos/Feria-magica-del-jugete-sin-fondo.webp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0C1B33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Cinzel:wght@700;800;900&family=Fredoka:wght@600;700;800;900&family=Henny+Penny&family=Luckiest+Guy&family=Mountains+of+Christmas:wght@700;900&family=Outfit:wght@400;600;700;800;900&family=Pacifico&family=Righteous&family=Titan+One&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- CONTENEDOR MAESTRO DE KIOSCO VERTICAL -->
    <div id="kiosk-app">
      <!-- 1. BARRA SUPERIOR FIJA -->
      <header id="kiosk-header" class="kiosk-header"></header>

      <!-- 2. ÁREA CENTRAL DE JUEGO Y MENÚS -->
      <main id="kiosk-main" class="kiosk-main">
        <!-- Canvas de Alto Rendimiento 60 FPS -->
        <canvas id="game-canvas" width="1080" height="1500"></canvas>

        <!-- Capas Superpuestas de UI -->
        <div id="attract-screen" class="kiosk-overlay attract-layer"></div>
        <div id="menu-screen" class="kiosk-overlay menu-layer" style="display: none;"></div>
        <div id="gameover-modal" class="kiosk-overlay modal-layer" style="display: none;"></div>
      </main>

      <!-- 3. CARRUSEL PUBLICITARIO INFERIOR (Según boceto wireframe) -->
      <footer id="kiosk-banner-carousel" class="kiosk-footer-carousel"></footer>

      <!-- Salvapantallas de Video de Inactividad a Pantalla Completa (1080x1920) -->
      <div id="attract-video-modal" class="attract-video-layer" style="display: none;">
        <video id="attract-video" playsinline webkit-playsinline x5-playsinline preload="auto" muted>
          <source src="./assets/video/video-1-feria.mp4" type="video/mp4">
        </video>
        <div class="attract-video-hint">
          <span>✨ Toca la pantalla para jugar ✨</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
