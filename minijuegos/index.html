<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Feria Mágica del Juguete - Minijuegos</title>
    <link rel="icon" type="image/png" href="/assets/logos/Feria-magica-del-jugete-sin-fondo.png" />
    <link rel="apple-touch-icon" href="/assets/logos/Feria-magica-del-jugete-sin-fondo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0C1B33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Cinzel:wght@700;800;900&family=Grand+Hotel&family=Outfit:wght@400;600;700;800;900&family=Rye&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- CONTENEDOR MAESTRO DE KIOSCO VERTICAL -->
    <div id="kiosk-app">
      <!-- 1. BARRA SUPERIOR FIJA -->
      <header id="kiosk-header" class="kiosk-header"></header>

      <!-- 2. ÁREA CENTRAL DE JUEGO Y MENÚS -->
      <main id="kiosk-main" class="kiosk-main">
        <!-- Canvas de Alto Rendimiento 60 FPS -->
        <canvas id="game-canvas" width="1080" height="1500"></canvas>

        <!-- Capas Superpuestas de UI -->
        <div id="attract-screen" class="kiosk-overlay attract-layer"></div>
        <div id="menu-screen" class="kiosk-overlay menu-layer" style="display: none;"></div>
        <div id="gameover-modal" class="kiosk-overlay modal-layer" style="display: none;"></div>

        <!-- Botón Accesible para Niños en Tótems de 55" (Altura Ergonómica ≈1.15m) -->
        <button id="btn-totem-child-menu" class="totem-child-btn" title="Volver al Menú" style="display: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>MENÚ</span>
        </button>
      </main>

      <!-- 3. CARRUSEL PUBLICITARIO INFERIOR (Según boceto wireframe) -->
      <footer id="kiosk-banner-carousel" class="kiosk-footer-carousel"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
