<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>
  
  <rect x="0" y="0" width="1000" height="240" rx="20" fill="url(#bgBanner1)"/>
  
  <!-- Decoraciones mágicas de fondo -->
  <circle cx="80" cy="120" r="70" fill="rgba(255,255,255,0.1)"/>
  <circle cx="920" cy="120" r="90" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Icono llamativo -->
  <g transform="translate(60, 40)">
    <text font-size="100" y="95">🎅✨</text>
  </g>
  
  <!-- Textos principales -->
  <g transform="translate(230, 0)">
    <text x="0" y="70" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#gold)" letter-spacing="1">¡GRAN SHOW DE SANTA Y DUENDES!</text>
    <text x="0" y="125" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Espectáculo en vivo, música y magia navideña cada tarde.</text>
    <rect x="0" y="150" width="340" height="48" rx="24" fill="#FFFFFF"/>
    <text x="170" y="182" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#C2185B" text-anchor="middle">🎪 HORARIO: 18:00 Y 20:00 HRS</text>
  </g>
</svg>
