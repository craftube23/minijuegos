apply plugin: 'com.android.application'

android {
    namespace = "com.feriamagica.minijuegos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.feriamagica.minijuegos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }
    packaging {
        resources {
            excludes += [
                'META-INF/com.android.tools/r8-version',
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Copia automática y segura del APK a Descargas / D:\Download tras cada compilación assembleDebug
tasks.register('copyApkToDownload') {
    doLast {
        def srcApk = file("${layout.buildDirectory.get().asFile}/outputs/apk/debug/app-debug.apk")
        if (srcApk.exists()) {
            // 1. Intento seguro en D:\Download si la unidad D: está disponible
            try {
                def dDrive = file("D:/")
                if (dDrive.exists()) {
                    def destDirD = file("D:/Download")
                    if (!destDirD.exists()) {
                        destDirD.mkdirs()
                    }
                    def targetD = file("D:/Download/app-debug.apk")
                    if (targetD.exists()) {
                        targetD.delete()
                    }
                    java.nio.file.Files.copy(
                        srcApk.toPath(),
                        targetD.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                    println "\n======================================================="
                    println ">>> APK COPIADO ATÓMICAMENTE A: D:\\Download\\app-debug.apk <<<"
                    println "=======================================================\n"
                }
            } catch (Exception e) {
                println "Aviso al copiar a D: " + e.getMessage()
            }

            // 2. Copia de respaldo garantizada en Carpeta Descargas de Windows
            try {
                def userHome = System.getProperty("user.home")
                def userDownloads = file("${userHome}/Downloads")
                if (userDownloads.exists()) {
                    def targetC = file("${userHome}/Downloads/app-debug.apk")
                    if (targetC.exists()) {
                        targetC.delete()
                    }
                    java.nio.file.Files.copy(
                        srcApk.toPath(),
                        targetC.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                    println "\n======================================================="
                    println ">>> APK COPIADO ATÓMICAMENTE A: ${targetC.absolutePath} <<<"
                    println "=======================================================\n"
                }
            } catch (Exception e) {
                println "Aviso al copiar a Downloads: " + e.getMessage()
            }
        }
    }
}

// El empaquetado, firmado universal v1/v2/v3 y copiado atómico a D:\ y Descargas se realiza
// de forma determinista mediante el script de despliegue post-build para garantizar firma completa y flush a disco.
